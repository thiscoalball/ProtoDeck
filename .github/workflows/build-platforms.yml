name: Build platform artifacts

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android APK
        required: true
        type: boolean
        default: true
      build_linux:
        description: Build Linux x64 bundle
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows x64 bundle
        required: true
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  APP_DIR: app

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      - working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-pub
      - working-directory: ${{ env.APP_DIR }}
        run: flutter test --no-pub

  android:
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      - working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-pub
      - name: Name artifact and write checksum
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/ProtoDeck-android.apk
          sha256sum build/ProtoDeck-android.apk > build/ProtoDeck-android.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ProtoDeck-android
          path: |
            ${{ env.APP_DIR }}/build/ProtoDeck-android.apk
            ${{ env.APP_DIR }}/build/ProtoDeck-android.apk.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ${{ env.APP_DIR }}
        run: flutter config --enable-linux-desktop
      - working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      - working-directory: ${{ env.APP_DIR }}
        run: flutter build linux --release --no-pub
      - name: Build bundled iPerf 3.21 for Linux
        working-directory: ${{ env.APP_DIR }}
        run: ./tool/build_bundled_iperf_linux.sh
      - name: Package relocatable Linux bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          tar -C build/linux/x64/release -czf build/ProtoDeck-linux-x64.tar.gz bundle
          sha256sum build/ProtoDeck-linux-x64.tar.gz > build/ProtoDeck-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ProtoDeck-linux-x64
          path: |
            ${{ env.APP_DIR }}/build/ProtoDeck-linux-x64.tar.gz
            ${{ env.APP_DIR }}/build/ProtoDeck-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_windows)
    # Flutter's current Windows plugins target the stable VS 2022 toolchain.
    # Avoid the VS 18 preview image, which removes legacy /await support.
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Preserve Unix line endings for embedded build scripts
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ${{ env.APP_DIR }}
        run: flutter config --enable-windows-desktop
      - working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      - working-directory: ${{ env.APP_DIR }}
        run: flutter build windows --release --no-pub
      - name: Build bundled iPerf 3.21 for Windows
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: >-
          ./tool/build_bundled_iperf_windows.ps1
          -ReleaseDirectory build/windows/x64/runner/Release
      - name: Package Windows application directory
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: >-
          Compress-Archive
          -Path build/windows/x64/runner/Release/*
          -DestinationPath build/ProtoDeck-windows-x64.zip
          -Force
      - name: Write Windows bundle checksum
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $hash = (Get-FileHash build/ProtoDeck-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ProtoDeck-windows-x64.zip" | Set-Content -Encoding ascii build/ProtoDeck-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ProtoDeck-windows-x64
          path: |
            ${{ env.APP_DIR }}/build/ProtoDeck-windows-x64.zip
            ${{ env.APP_DIR }}/build/ProtoDeck-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

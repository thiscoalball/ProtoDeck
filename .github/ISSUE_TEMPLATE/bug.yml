name: Bug report
description: Report a reproducible ProtoDeck defect
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private addresses, SSIDs, BSSIDs, device identifiers and sensitive payloads. Report security vulnerabilities through the private process in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Linux
        - iOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and permissions
      description: OS version, device type, network type and relevant granted/denied permissions.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here only after removing sensitive information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain secrets or private infrastructure data.
          required: true
        - label: This is not a security vulnerability.
          required: true
